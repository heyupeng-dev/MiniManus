name: minimanus

services:
  postgres:
    image: postgres:16-alpine
    container_name: minimanus-postgres
    restart: unless-stopped
    ports:
      - "15432:5432"
    environment:
      POSTGRES_USER: minimanus
      POSTGRES_PASSWORD: 123456
      POSTGRES_DB: minimanus
    volumes:
      - minimanus_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: minimanus-redis
    restart: unless-stopped
    ports:
      - "16379:6379"
    volumes:
      - minimanus_redis_data:/data

volumes:
  minimanus_postgres_data:
    name: minimanus_postgres_data
  minimanus_redis_data:
    name: minimanus_redis_data
